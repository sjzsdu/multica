name: Build and Push Self-Host Images

# Fork 自用:构建本仓库(而非上游)的后端/前端镜像并推到 Docker Hub,
# 供 deploy 仓库的 multica/ 服务 pull(sjzsdu/multica-backend、sjzsdu/multica-web)。
#
# 触发方式(参考 EventTraderApi 的 deploy.yml):
#   1. 推送 main 分支 → latest + sha-<短SHA>
#   2. 推送 v* 标签 → latest + v0.6.2
#   3. Actions 页面手动触发(workflow dispatch),可自定义版本号
#
# 必需的仓库 Secrets(sjzsdu/multica → Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  Docker Hub 用户名(sjzsdu)
#   DOCKERHUB_TOKEN     Docker Hub Personal Access Token(Write 权限)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号(如 v0.6.2),留空用 short SHA"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              version="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sjzsdu/multica-backend
            file: Dockerfile
            build-args: |
              VERSION=${{ needs.resolve.outputs.version }}
              COMMIT=${{ github.sha }}
          - image: sjzsdu/multica-web
            file: Dockerfile.web
            build-args: |
              NEXT_PUBLIC_APP_VERSION=${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          pull: true
          push: true
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ needs.resolve.outputs.version }}

      - name: Inspect pushed image
        run: docker buildx imagetools inspect ${{ matrix.image }}:${{ needs.resolve.outputs.version }}
